<!doctype html><meta charset="utf-8"><title>WebGL 探针</title>
<pre id="o">检测中…</pre>
<script>
const lines=[];
for (const name of ['webgl2','webgl','experimental-webgl']) {
  const c=document.createElement('canvas');
  let ctx=null, err='';
  try { ctx=c.getContext(name); } catch(e){ err=e.message; }
  lines.push(name+' => '+(ctx? 'OK':'null')+(err?(' err='+err):''));
  if(ctx){
    const dbg=ctx.getExtension('WEBGL_debug_renderer_info');
    lines.push('  VENDOR='+ctx.getParameter(ctx.VENDOR));
    lines.push('  RENDERER='+ctx.getParameter(ctx.RENDERER));
    if(dbg) lines.push('  UNMASKED='+ctx.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
  }
}
document.getElementById('o').textContent='PROBE_BEGIN\n'+lines.join('\n')+'\nPROBE_END';
</script>
