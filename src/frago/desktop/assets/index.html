<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>desktop stage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="desktop">
    <!-- 桌布。整块色场只画 96×54 再让浏览器拉满全屏——这不是省性能的妥协，
         而是这套做法本来就只产生两三团巨大的软色块，没有任何需要分辨率去
         承载的细节；放大过程中的双线性插值反而正好当了免费的柔化。
         画布内部尺寸写死，显示尺寸交给 CSS 百分比，改桌面分辨率不用重建。 -->
    <canvas id="wp-mesh" width="96" height="54"></canvas>

    <div id="menubar">
      <div class="mb-left">
        <span id="apple-logo" aria-hidden="true"></span>
        <span id="mb-app" class="mb-app">Terminal</span>
        <span class="mb-item">File</span>
        <span class="mb-item">Edit</span>
        <span class="mb-item">View</span>
        <span class="mb-item">Window</span>
        <span class="mb-item">Help</span>
      </div>
      <div class="mb-right">
        <span id="mb-battery" aria-hidden="true"><i></i></span>
        <span id="mb-wifi" aria-hidden="true">
          <svg viewBox="0 0 16 12.5" width="16" height="12.5">
            <g fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.6"
               stroke-linecap="round">
              <path d="M1.50 5.30 A9.2 9.2 0 0 1 14.50 5.30"/>
              <path d="M3.69 7.49 A6.1 6.1 0 0 1 12.31 7.49"/>
              <path d="M5.88 9.68 A3.0 3.0 0 0 1 10.12 9.68"/>
            </g>
            <circle cx="8" cy="11.3" r="1.05" fill="rgba(255,255,255,.92)"/>
          </svg>
        </span>
        <span id="mb-clock">--:--</span>
      </div>
    </div>

    <div class="stage-window" id="win-term" data-win="term">
      <div class="titlebar">
        <div class="traffic"><span class="tl red"></span><span class="tl yellow"></span><span class="tl green"></span></div>
        <div class="win-title">Terminal</div>
      </div>
      <!-- 终端画的是一整块可回看的缓冲区（历史 + 当前屏），不是最后一屏：
           窗口装得下几十行，而命令输出动辄几百行，只画当前屏的话前面的内容
           在画面上就永远找不回来了。#term-scroll 是视口，指令驱动它上下滚；
           每一行单独一个元素，broker 推增量时只需要动尾巴那几行。 -->
      <div class="win-body term-body">
        <div class="term-scroll" id="term-scroll"><div id="term-screen"></div></div>
      </div>
    </div>

    <div class="stage-window" id="win-image" data-win="image" hidden>
      <div class="titlebar">
        <div class="traffic"><span class="tl red"></span><span class="tl yellow"></span><span class="tl green"></span></div>
        <div class="win-title" id="image-title">Preview</div>
      </div>
      <div class="win-body image-body">
        <img id="image-view" alt="">
      </div>
    </div>

    <div class="stage-window" id="win-browser" data-win="browser">
      <div class="titlebar">
        <div class="traffic"><span class="tl red"></span><span class="tl yellow"></span><span class="tl green"></span></div>
        <div class="win-title" id="browser-title">Chrome</div>
      </div>
      <div class="browser-chrome">
        <div class="tab-strip" id="tab-strip">
          <div class="tab active"><span class="tab-favicon"></span><span id="tab-title" class="tab-title">New Tab</span></div>
        </div>
        <div class="toolbar">
          <span class="nav-btn" aria-hidden="true">&#x2039;</span>
          <span class="nav-btn dim" aria-hidden="true">&#x203A;</span>
          <div class="addressbar">
            <span id="addr-spinner" class="spinner"></span>
            <span id="addr-url" class="addr-url"></span>
          </div>
        </div>
      </div>
      <div class="win-body browser-body">
        <canvas id="browser-canvas"></canvas>
        <!-- 演员标签没了就露出这一层。做成浏览器自己的空白起始页而不是错误提示：
             从虚拟桌面的视角，标签被关掉就等于浏览器没开着页面，这是它本来该有的
             样子。留着最后一帧假装画面还在，才是那个会骗人的选项。 -->
        <div id="browser-newtab" class="browser-newtab" hidden>
          <div class="nt-mark" aria-hidden="true">
            <span class="nt-dot nt-b"></span><span class="nt-dot nt-r"></span>
            <span class="nt-dot nt-y"></span><span class="nt-dot nt-g"></span>
          </div>
          <div class="nt-search"><span class="nt-search-icon" aria-hidden="true">&#x25CB;</span></div>
        </div>
      </div>
    </div>

    <div id="dock">
      <div class="dock-item" id="dock-term">
        <div class="dock-icon icon-terminal"><span>&gt;_</span></div>
        <span class="dock-dot"></span>
      </div>
      <div class="dock-item" id="dock-browser">
        <div class="dock-icon icon-chrome">
          <svg viewBox="0 0 40 40" width="25" height="25" aria-hidden="true">
            <defs>
              <linearGradient id="globeGloss" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
                <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
              <circle cx="20" cy="20" r="14.2"/>
              <ellipse cx="20" cy="20" rx="6" ry="14.2"/>
              <path d="M6.4 20 H33.6"/>
              <path d="M9.1 12.4 C14 14.6 26 14.6 30.9 12.4"/>
              <path d="M9.1 27.6 C14 25.4 26 25.4 30.9 27.6"/>
            </g>
            <circle cx="20" cy="20" r="14.2" fill="url(#globeGloss)"/>
          </svg>
        </div>
        <span class="dock-dot"></span>
      </div>
      <div class="dock-item" id="dock-image">
        <div class="dock-icon icon-image">
          <svg viewBox="0 0 40 40" width="25" height="25" aria-hidden="true">
            <defs>
              <linearGradient id="photoGloss" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
                <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect x="5.5" y="7.5" width="29" height="25" rx="3"
                  fill="none" stroke="#fff" stroke-width="2"/>
            <circle cx="15" cy="16" r="3.4" fill="#fff"/>
            <path d="M6.5 29.5 L15 21 L21 27 L27 21.5 L33.5 28"
                  fill="none" stroke="#fff" stroke-width="2.1"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="5.5" y="7.5" width="29" height="25" rx="3"
                  fill="url(#photoGloss)"/>
          </svg>
        </div>
        <span class="dock-dot"></span>
      </div>
    </div>

    <div id="caption"></div>

    <!-- 浮层标注层。和 #caption 各走各的：字幕讲话、浮层指画面，
         两者常常同时在场，共用容器会让一方的清理误伤另一方。 -->
    <div id="overlay-layer"></div>

    <!-- 标准 macOS 箭头，放大到约两倍。
         为什么不做个性化造型：Screen Studio 这类录屏工具的指针设置里，
         形态只有「macOS 箭头」和「触摸圆点」两个选项，可调的全是行为
         （大小、平滑、静止隐藏）；给指针套光圈那类装饰会把注意力吸到
         指针本身而不是它要点的按钮，快速移动时还刺眼。观众要认的是
         「这是个鼠标」，任何需要辨认的造型都在消耗这一眼。

         白底黑描边是这个形状能同时压在深色终端和浅色网页上的原因。
         描边宽 1.2、居中，所以路径整体内缩 0.6 给描边留位置——
         尖端因此落在 (0.6, 0.6)，乘缩放比 1.58 得 0.9px，
         app.js 与 CSS 的 transform-origin 都按这个数补偏移。 -->
    <div id="vcursor">
      <svg width="20" height="32" viewBox="0 0 12.6 20.3">
        <path d="M.6.6 V17.9 L4.9 13.7 L7.6 19.7 L9.9 18.6 L7.2 12.9 H12 Z"
              fill="#ffffff" stroke="#0b0e13" stroke-width="1.2"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="ripple-layer"></div>

    <!-- 扫描灯：一个光点沿底边往复扫，KITT 那种。
         它不是装饰，是这套系统的取景保障——CDP 只在页面重绘时产帧，
         桌面静止时帧率会掉到 3fps 上下，运镜（推近/摇镜）就一顿一顿的。
         canvas 逐帧重画持续触发重绘，实测把帧率钉在 90 上下。
         顺带也是 agent OS 的身份标识：这不是普通录屏。 -->
    <canvas id="scanline" width="1920" height="18"></canvas>
  </div>
</div>
<script src="ansi.js"></script>
<script src="app.js"></script>
</body>
</html>
