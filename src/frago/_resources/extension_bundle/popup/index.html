<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>frago bridge</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f7f7;
      --bg-subtle: #f5f5f5;
      --bg-hover: rgba(0, 0, 0, 0.045);
      --code-bg: rgba(0, 0, 0, 0.05);
      --text-primary: rgba(0, 0, 0, 0.9);
      --text-secondary: rgba(0, 0, 0, 0.62);
      --text-muted: rgba(0, 0, 0, 0.45);
      --text-on-accent: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-color: rgba(0, 0, 0, 0.09);
      --border-strong: rgba(0, 0, 0, 0.16);
      --accent-primary: #0a8f33;
      --font-family: "Geist Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", sans-serif;
      --font-mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1f1f1f;
        --bg-secondary: #1a1a1a;
        --bg-subtle: #1a1a1a;
        --bg-hover: rgba(255, 255, 255, 0.06);
        --code-bg: rgba(255, 255, 255, 0.07);
        --text-primary: rgba(255, 255, 255, 0.92);
        --text-secondary: rgba(255, 255, 255, 0.62);
        --text-muted: rgba(255, 255, 255, 0.42);
        --text-on-accent: #06210f;
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-color: rgba(255, 255, 255, 0.09);
        --border-strong: rgba(255, 255, 255, 0.16);
        --accent-primary: #15b34d;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      width: 276px;
      padding: 12px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 12.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .version-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 5px;
    }

    .diag-card {
      margin: 10px 0;
      padding: 8px 10px;
      border-radius: 9px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .diag-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }

    .diag-key {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    code {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--code-bg);
      color: var(--text-primary);
      padding: 1px 5px;
      border-radius: 4px;
      word-break: break-all;
      text-align: right;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 32px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .btn.primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: var(--text-on-accent);
      font-weight: 600;
    }

    .btn.primary:hover {
      background: color-mix(in srgb, var(--accent-primary) 90%, #000);
      border-color: color-mix(in srgb, var(--accent-primary) 90%, #000);
    }
  </style>
</head>
<body>
  <div class="head">
    <span class="title-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>frago bridge</span>
    </span>
    <span class="version-tag">v0.4.0</span>
  </div>

  <button id="open-sidepanel" class="btn primary" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
    <span>打开会话桥接侧边栏</span>
  </button>

  <div class="diag-card">
    <div class="diag-row">
      <span class="diag-key">Extension ID</span>
      <code id="eid">...</code>
    </div>
    <div class="diag-row">
      <span class="diag-key">Native host</span>
      <code id="status">checking…</code>
    </div>
    <div class="diag-row">
      <span class="diag-key">Proxy</span>
      <code id="proxy-status">checking…</code>
    </div>
  </div>

  <button id="open-options" class="btn" type="button">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
    <span>服务连接与代理设置</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
