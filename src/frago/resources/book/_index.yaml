# frago Knowledge Book — Topic Index
# Categories: must (替代), better (偏好), available (效率)
# frago-principle-* 是 frago 的第一性原理——用 must/better/available 复用现有标签等级

# 第一性原理 — frago 的根本主张，决定一切设计取舍
- name: frago-principle-os
  category: available
  brief: "frago=agent OS，四支柱 hook/系列命令/def/recipe；UI 是给人用的不在 agent 视野"

- name: frago-principle-supreme
  category: must
  brief: "最高准则=让 agent 更容易正确地使用 frago，所有取舍回到这条"

- name: frago-principle-trust
  category: must
  brief: "默认相信 frago 命令——agent-first 设计、有 token 节省工程、语义贴 agent 视角；冲突先信 frago"

- name: frago-principle-rigor
  category: must
  brief: "抽丝剥茧不跳步、禁止截断数据、改完代码必须验证再汇报——刻意对抗训练缺陷"

- name: frago-principle-extend
  category: better
  brief: "重复路由→frago hook-rules add；重复知识→frago <domain> save；重复工作流→recipe；不要硬编码进 Rust"

# 替代类 — 不遵守会出错
- name: must-browser-search
  category: must
  brief: "与搜索有关、与使用浏览器有关、与使用网页或网页数据有关的一切行为，一律走 frago browser；禁止 WebSearch；三层优先级 默认 > -b cdp（无头/独立实例）> 自起进程（禁止）"

- name: must-browser-fetch
  category: must
  brief: "渲染/截图/读取任何网页（含 file:// 本地 html）都用 navigate + get-content + screenshot；禁止 WebFetch；要无头走 frago browser -b cdp，NEVER 自起 chrome --headless"

- name: must-tool-priority
  category: must
  brief: "工具选择四层优先级：Recipe > frago命令 > 系统命令 > Claude工具"

- name: must-execution-principles
  category: must
  brief: "不假设意图、不停在计划、工具驱动、结果优先、建议而非擅自决定"

- name: must-data-dir
  category: must
  brief: "产出一律落 ~/.frago/data/<主体>/<YYYYMMDD>-<slug>/，两层缺一不可，事务 NEVER 直接建在 data 根下；建目录前先 frago context data:<关键词> 查现成落点；projects 是 frago 的会话账本 agent 不写；路径一律绝对路径"

- name: desktop-usage
  category: must
  brief: "虚拟桌面（录屏/演示）：frago desktop，标准路径 status → up → 驱动；停了就是停了，守护不自动拉起"

- name: browser-usage
  category: must
  brief: "browser 操作完整指南：一个 group = 浏览器里一个真标签组、最多 5 页、navigate 默认替换当前页、--new 才开新页、tab 命令只碰本组、用完 group-close（30 分钟静默兜底）"

- name: browser-backend-choice
  category: must
  brief: "浏览器三层优先级：默认 extension 后端（无 flag，驱动 Edge 的真实 profile，anti-bot 天然过检）> -b cdp（真无头/独立实例/--void/--app，端口默认 9222，白名单另有 9223 供 agent_os 机位专用；9222 上还住着 agent_os 演员，舞台跑着时别起别停）> 自起进程（禁止）；group 规则两端一致"

- name: browser-anti-bot
  category: available
  brief: "Cloudflare/Datadome/captcha：`browser detect --group <g>` 探针 + interactive/invisible/blocked 三档处理"

- name: browser-startup
  category: available
  brief: "browser start：零参数拉起浏览器+扩展桥，Edge 是 frago 的默认浏览器（两个后端同序），使用浏览器自己的真实 profile；NEVER 传 --browser（换不了浏览器，只会让 profile 目录错位）"

- name: must-no-auto-memory
  category: must
  brief: "禁用 Claude Code auto memory，结构化沉淀走 frago <domain> save，忽略 MEMORY.md"

- name: agent-worker-driving
  category: must
  brief: "子任务用 frago agent 驱动 worker：--yes 一轮 / start-send-peek-stop 常驻；禁止手搓 tmux+claude（权限确认卡死+代批被平台拦截）"

- name: must-system-frago
  category: must
  brief: "一切命令用 frago；`uv run frago` 唯一例外是打包入口 server start|restart，仓库版本配系统 server 是没人跑的组合"

- name: prompt-form-protocol
  category: must
  brief: "prompt 形态判定协议：命令/真提问/反问/宣泄四形态各自义务、判不清按真提问、改状态动作须指向当轮明示指令"

- name: must-explain-in-business-language
  category: must
  brief: "解释问题用业务语言：环节→坏在哪个点→具体表现→影响分层→为何没发现→修了什么；禁止拿函数名/变量名/行号当解释"

# 偏好类 — 有更好的方式
- name: better-recipe-gate
  category: better
  brief: "写临时脚本前先过判断闸：五问决定这段劳动要不要固化成 recipe；重复的东西分四条出路（hook/def/recipe/book）"

- name: better-structured-data
  category: better
  brief: "结构化数据用 frago def 注册域、`<domain>` 存取，比手写 JSON 更规范"

- name: better-git-checkout
  category: better
  brief: "git checkout 前先审视意图，部分撤销用 diff + Edit 精确还原"

- name: better-server-restart
  category: better
  brief: "server restart 前先检查活跃任务，有任务时禁止自行 --force"

- name: hook-rules-authoring
  category: better
  brief: "观察到重复路由模式时用 frago hook-rules add 沉淀为数据化规则，不改 Rust"

# 效率类 — 你可能不知道有这个
- name: context-recall
  category: available
  brief: "【召回三入口·产物层】过去的产出落在哪：frago context data:<关键词>，模糊匹配 ~/.frago/data 只报位置不吐正文，读哪个由你定；判断要召回时这是唯一路径，NEVER ls 目录挨个猜（见宪法条目「召回优先」）"

- name: session-search
  category: available
  brief: "【召回三入口·过程层】当时怎么做的、怎么定的、用户怎么说的：frago session search \"<一句话>\"，模型扩关键词 + ripgrep 扫 ~/.frago/sessions 双库备份（含 Claude 已滚删的老会话）；NEVER 回答「我不记得了」，NEVER 手工 grep 原始会话库（见宪法条目「召回优先」）"

- name: recipe-execution
  category: available
  brief: "frago recipe list/run 查询和执行已有 recipe"

- name: interactive-recipe
  category: available
  brief: "Web UI 人机协作 Recipe 架构、launcher、API 交互、状态管理"

- name: recipe-authoring
  category: available
  brief: "Recipe 脚本编写规范：参数接收（sys.argv[1]/$1/__FRAGO_PARAMS__）、输出规范、代码模板"

- name: recipe-fields
  category: available
  brief: "Recipe 元数据必填/可选字段、flow/env 规范、validate 检查项"

- name: domain-insights
  category: available
  brief: "【已退役】run insights 读写入口均已关闭，沉淀与查询一律走 frago <域名> save / find；本章只留迁移指引与历史数据位置"

- name: recipe-spec-writing
  category: available
  brief: "Recipe spec 撰写规范：从需求到 spec.md 的结构化定义"

- name: recipe-creation
  category: available
  brief: "Recipe 创建规范：从 spec.md 到 recipe.md + 脚本的完整流程"

- name: def-knowledge
  category: available
  brief: "【召回三入口·结论层】已沉淀的结论去哪查：frago def 结构化知识系统，domain 注册、`<domain>` find 查询、`<domain>` save 沉淀（见宪法条目「召回优先」）"
