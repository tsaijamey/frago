<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frago</title>
    <style>
      /* 两套主题各自的开画底色。这两条必须在样式表加载之前就位，否则第一帧会闪
         一下另一套主题的底色。数值与 globals.css 里的 --page-bg 一致。 */
      html[data-theme='dark'] { background-color: #141414; color-scheme: dark; }
      html[data-theme='light'] { background-color: #f2f2f2; color-scheme: light; }
    </style>
    <script>
      // 主题要在第一帧之前定下来。React 挂上之前谁都没机会改 <html>，
      // 这一段读回上次的选择，页面就不会先按 dark 画一帧再跳成 light。
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (_) {
          // localStorage 不可用时保留标签上的默认值
        }
      })();
    </script>
    <script>
      // Calculate font scale based on SCREEN resolution (not viewport)
      // Base: 1080p screen height = 13px, linear scale with min/max limits
      (function () {
        var baseHeight = 1080;
        var baseFontSize = 13;
        var minFontSize = 10;
        var maxFontSize = 18;

        // Use screen.height (screen resolution), not innerHeight (viewport)
        var screenHeight = window.screen.height;
        var calculatedSize = (screenHeight / baseHeight) * baseFontSize;
        var clampedSize = Math.max(minFontSize, Math.min(maxFontSize, calculatedSize));
        var scale = clampedSize / baseFontSize;

        // Readability boost: the resolution-derived scale alone left body text
        // small (≈12px) for sustained reading. Lift everything ~15%.
        var readabilityBoost = 1.15;
        scale = scale * readabilityBoost;

        // Inline style on <html> wins over the :root fallback in globals.css,
        // so THIS is the effective font scale — tune it here, not in CSS.
        document.documentElement.style.setProperty('--font-scale', scale);
      })();
    </script>
    <style>
      /* Prerendered loading UI */
      #frago-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #141414;
        color: rgba(255, 255, 255, 0.92);
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      /* 启动屏跟着主题走。它盖满整屏，画错了就是整屏画错。 */
      html[data-theme='light'] #frago-loading {
        background-color: #f2f2f2;
        color: rgba(0, 0, 0, 0.9);
      }
      html[data-theme='light'] .loading-spinner {
        border-color: rgba(10, 143, 51, 0.18);
        border-top-color: #0a8f33;
      }
      html[data-theme='light'] .loading-error {
        color: #c42b45;
      }
      #frago-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(21, 179, 77, 0.15);
        border-top-color: #15b34d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        font-size: 14px;
        opacity: 0.7;
      }
      .loading-error {
        color: #ff4444;
        font-size: 13px;
        margin-top: 16px;
        max-width: 400px;
        text-align: center;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <!-- Prerendered loading UI - visible until React mounts -->
    <div id="frago-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">启动中...</div>
      <div class="loading-error" id="loading-error" style="display: none;"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Hide loading screen when React mounts
      window.addEventListener('DOMContentLoaded', function() {
        var loadingEl = document.getElementById('frago-loading');
        var errorEl = document.getElementById('loading-error');
        var retryCount = 0;
        var maxRetries = 30; // 30 seconds max

        function checkServerReady() {
          fetch('/api/status')
            .then(function(res) {
              if (res.ok) {
                // Server is ready, loading will be hidden by React mount
                return;
              }
              throw new Error('Server not ready');
            })
            .catch(function(err) {
              retryCount++;
              if (retryCount < maxRetries) {
                setTimeout(checkServerReady, 1000);
              } else {
                errorEl.textContent = '服务器启动超时，请检查日志或重新启动';
                errorEl.style.display = 'block';
              }
            });
        }

        // Start checking server status
        checkServerReady();
      });

      // Prefetch session data in parallel with bundle download
      (function () {
        var prefetched = {sessions: null, fetchedAt: null};
        try {
          fetch('/api/workbench/sessions')
            .then(function (res) {
              if (res.ok) return res.json();
              throw new Error('Prefetch failed');
            })
            .then(function (data) {
              prefetched.sessions = data;
              prefetched.fetchedAt = Date.now();
            })
            .catch(function () {
              // Silently fail — React will retry on mount
            });
        } catch (_) {
          // Silently fail
        }
        window.__frago_prefetched__ = prefetched;
      })();

      // Hide loading when React app is mounted
      window.fragoHideLoading = function() {
        var loadingEl = document.getElementById('frago-loading');
        if (loadingEl) {
          loadingEl.classList.add('fade-out');
          setTimeout(function() {
            loadingEl.style.display = 'none';
          }, 300);
        }
      };
    </script>
  </body>
</html>
