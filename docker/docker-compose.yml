name: frago-support

services:
  linux:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: frago-support-env:py313
    platform: linux/amd64
    container_name: frago-support-linux
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      - HOME=/root/frago-linux-home
      # 不在全局写死 PYTHONPATH，让容器默认运行 pip 安装的 wheel 版本；
      # 需要切换源码模式时可通过 `frago-service mode source` 或环境传参动态启用
      - FRAGO_TEST_TARGET=linux
      - FRAGO_BROWSER_PROXY=http://host.docker.internal:7890
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,::1,host.docker.internal
    volumes:
      - ..:/workspace:ro
    command:
      - frago-service
      - run

  wsl2:
    image: frago-support-env:py313
    platform: linux/amd64
    container_name: frago-support-wsl2
    environment:
      - HOME=/root/frago-wsl2-home
      - PYTHONPATH=/workspace/src
      - FRAGO_TEST_TARGET=wsl2
      - WSL_DISTRO_NAME=Ubuntu-24.04
      - WSL_INTEROP=/run/WSL/1_interop
      - WSLENV=USERPROFILE/p:APPDATA/p:LOCALAPPDATA/p
      - HOST_USERPROFILE=/mnt/c/Users/frago
    volumes:
      - ..:/workspace:ro
    command: >
      sh -c "mkdir -p $$HOME /mnt/c/Users/frago /run/WSL &&
             touch /run/WSL/1_interop &&
             python3 /workspace/docker/verify_env.py --expect wsl2"
